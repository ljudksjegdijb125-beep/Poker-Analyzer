<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>扑克机 · 启动诊断</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#151719;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
body{padding:22px}
.box{width:min(480px,100%);margin:auto;padding:20px;border:1px solid #dfe2e5;border-radius:18px;background:#fff;box-shadow:none}
header{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border:1px solid #bfc4c9;border-radius:12px;background:#f7f8f9;color:#1c2024;display:grid;place-items:center;font-size:19px}h1{margin:0;font-size:18px;color:#151719}header small{display:block;margin-top:3px;color:#737980}p{color:#41464c;font-size:12px;line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.actions button{min-height:42px;border:1px solid #9fa5ab;border-radius:11px;background:#fff;color:#1c2024;font:inherit;font-size:12px}.actions button.primary{grid-column:1/-1;background:#1c2024;color:#fff;border-color:#1c2024}.actions button:last-child{grid-column:1/-1}.status{padding:12px;border:1px solid #eef0f2;border-radius:12px;background:#f7f8f9;color:#41464c;font-size:11px;line-height:1.65;white-space:pre-wrap}.checks{display:grid;gap:7px;margin-top:11px}.check{display:grid;grid-template-columns:9px 1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid #dfe2e5;border-radius:10px;background:#fff;font-size:10px}.check i{width:7px;height:7px;border-radius:50%;background:#737980}.check.ok i{background:#1c2024}.check.bad i{background:#a33a32}.check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.check small{color:#737980}.note{margin-top:12px;color:#737980;font-size:10px;line-height:1.65}
</style>
</head>
<body>
<main class="box">
 <header><div class="mark">♠</div><div><h1>启动诊断与恢复</h1><small>V45.7.27 · 构建时间 2026-08-31（北京时间）</small></div></header>
 <p>这里独立于主程序运行。可以检查部署文件、重新请求最新版，或只清理离线服务与网页缓存。</p>
 <div class="actions"><button class="primary" onclick="freshReload()">重新加载最新版</button><button onclick="openSafeRepair()">打开安全修复页</button><button onclick="openWithoutWorker()">无离线服务打开</button><button onclick="skipBootOnce()">仅跳过一次待机画面</button></div>
 <div id="status" class="status">正在检查部署文件…</div>
 <div id="checks" class="checks"></div>
 <div class="note">“修复缓存”不会操作 localStorage 或 IndexedDB，因此不会主动删除人物、面具、聊天、设置和接口配置。若检查结果显示旧版本，请重新完整覆盖部署包。</div>
</main>
<script>
const BUILD='45.7.27';
const BUILD_ID='V45.7.27-20260831-CST';
const targets=[
 {name:'构建编号',path:'/build-info.json',marker:BUILD_ID},
 {name:'页面入口',path:'/index.html',marker:BUILD_ID},
 {name:'主程序',path:'/assets/app.js',marker:"const VERSION='45.7.27'"},
 {name:'主样式',path:'/assets/app.css',marker:'#bootScreen'},
 {name:'离线服务',path:'/sw-v44.js',marker:"pokeji-v45.7.27"},
 {name:'应用清单',path:'/manifest.webmanifest',marker:'45.7.27'},
 {name:'白底界面样式',path:'/assets/v45.7.17-global-white.css',marker:'V45.7.27'},
 {name:'缓存修复页',path:'/repair-sw.html',marker:BUILD_ID}
];
const status=document.getElementById('status'),checks=document.getElementById('checks');
function row(item){const el=document.createElement('div');el.className='check '+(item.ok?'ok':'bad');el.innerHTML=`<i></i><span>${item.name}</span><small>${item.detail}</small>`;checks.appendChild(el)}
async function inspect(){
 checks.innerHTML='';let passed=0;
 for(const target of targets){
  try{
   const join=target.path.includes('?')?'&':'?',response=await fetch(target.path+join+'probe='+Date.now(),{cache:'no-store',credentials:'same-origin'}),type=String(response.headers.get('content-type')||''),body=await response.text();
   const markerOk=body.includes(target.marker),typeOk=!/\.(?:js)$/i.test(target.path)||/(?:javascript|ecmascript|text\/plain)/i.test(type),ok=response.ok&&markerOk&&typeOk;
   if(ok)passed++;row({name:target.name,ok,detail:ok?'V'+BUILD:(!response.ok?'HTTP '+response.status:!typeOk?'类型错误':'版本不符')});
  }catch(error){row({name:target.name,ok:false,detail:'无法读取'})}
 }
 status.textContent=passed===targets.length?`检查完成：${passed}/${targets.length} 项正常。\n可以直接重新加载最新版。`:`检查完成：${passed}/${targets.length} 项正常。\n部署文件仍不完整或旧缓存尚未退出，请先修复缓存；若版本仍不符，需要重新覆盖部署包。`;
}
function freshReload(){location.replace('/index.html?manual-reload='+BUILD+'&t='+Date.now())}
function openWithoutWorker(){location.replace('/index.html?no-sw=1&diagnostic='+BUILD+'&t='+Date.now())}
function skipBootOnce(){try{sessionStorage.setItem('pokeji_skip_boot_once','1')}catch(error){}location.replace('/index.html?skip-boot=1&t='+Date.now())}
function openSafeRepair(){location.href='/repair-sw.html?from=diagnostics-'+BUILD}
inspect();
</script>
</body>
</html>
